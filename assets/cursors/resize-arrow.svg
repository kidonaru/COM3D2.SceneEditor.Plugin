<!--
  リサイズカーソルの双方向矢印 (32x32)。
  白い矢印を黒で縁取り、明るい背景でも暗い背景でも視認できるようにしている。
  この 1 枚を generate.js が 0/90/45/-45 度に回転させて 4 種類の PNG を書き出す。
  中心 (16,16) がホットスポットなので、回転しても位置がずれないよう図形は中心対称にすること。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <polygon
    points="6,16 12.5,11.8 12.5,14.5 19.5,14.5 19.5,11.8 26,16 19.5,20.2 19.5,17.5 12.5,17.5 12.5,20.2"
    fill="#ffffff"
    stroke="#000000"
    stroke-width="0.8"
    stroke-linejoin="miter" />
</svg>
