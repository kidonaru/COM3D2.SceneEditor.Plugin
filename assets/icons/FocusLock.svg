<!--
  タイムライン操作「フォーカス固定」アイコン (32x32)。照準の輪と右下の南京錠。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 照準 -->
  <g fill="none" stroke="#000000" stroke-width="4.2" stroke-linecap="round">
    <circle cx="13" cy="13" r="8" />
    <path d="M 13 2 L 13 6 M 2 13 L 6 13 M 13 20 L 13 24 M 20 13 L 24 13" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <circle cx="13" cy="13" r="8" />
    <path d="M 13 2 L 13 6 M 2 13 L 6 13 M 13 20 L 13 24 M 20 13 L 24 13" />
  </g>
  <circle cx="13" cy="13" r="2" fill="#ffffff" stroke="#000000" stroke-width="0.8" />
  <!-- 南京錠 -->
  <path d="M 21 21 L 21 18.5 A 4 4 0 0 1 29 18.5 L 29 21" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <rect x="18" y="20" width="14" height="11" rx="1.5" fill="#000000" />
  <path d="M 21 21 L 21 18.5 A 4 4 0 0 1 29 18.5 L 29 21" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <rect x="19.6" y="21.6" width="10.8" height="7.8" rx="1" fill="#ffffff" />
</svg>
