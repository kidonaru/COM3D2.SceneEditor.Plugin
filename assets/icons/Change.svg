<!--
  カラーピッカーの表色系「切り替え」アイコン (32x32)。左右逆向きの 2 本の矢印。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 上段は右向き、下段は左向きの矢印 -->
  <g fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 7 11 L 25 11 M 19.5 6 L 25 11 L 19.5 16" />
    <path d="M 25 21 L 7 21 M 12.5 16 L 7 21 L 12.5 26" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 7 11 L 25 11 M 19.5 6 L 25 11 L 19.5 16" />
    <path d="M 25 21 L 7 21 M 12.5 16 L 7 21 L 12.5 26" />
  </g>
</svg>
