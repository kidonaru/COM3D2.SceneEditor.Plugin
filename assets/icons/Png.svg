  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 6 4 L 20 4 L 26 10 L 26 28 L 6 28 Z M 20 4 L 20 10 L 26 10" />
    <path d="M 9 24 L 14 17 L 18 21 L 20 19 L 23 24" />
  </g>
</svg>
