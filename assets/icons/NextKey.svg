  <polygon points="3,5 19,16 3,27" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
  <polygon points="20,16 25,11 30,16 25,21" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
</svg>
