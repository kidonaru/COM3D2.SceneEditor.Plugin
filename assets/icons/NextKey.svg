<!--
  タイムライン操作「次のキーフレームへ」アイコン (32x32)。右向きの三角と右のひし形。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <polygon points="4,7 16,16 4,25" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
  <polygon points="23,10 29,16 23,22 17,16" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
</svg>
