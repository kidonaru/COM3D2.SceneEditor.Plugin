<!--
  タイムライン操作「前のキーフレームへ」アイコン (32x32)。左のひし形と左向きの三角。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <polygon points="28,7 16,16 28,25" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
  <polygon points="9,10 15,16 9,22 3,16" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
</svg>
