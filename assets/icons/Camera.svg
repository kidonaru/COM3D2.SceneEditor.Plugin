<!--
  タイムライン操作「カメラ同期」アイコン (32x32)。右にレンズ筒を突き出したビデオカメラ。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="#ffffff" stroke="#000000" stroke-width="0.8" stroke-linejoin="round">
    <!-- 本体 -->
    <rect x="3" y="9" width="18" height="14" rx="2" />
    <!-- レンズ筒 (右へ広がる台形) -->
    <path d="M 21 14 L 29 9.5 L 29 22.5 L 21 18 Z" />
  </g>
  <!-- 録画ランプ -->
  <circle cx="8" cy="14" r="2" fill="#000000" />
</svg>
