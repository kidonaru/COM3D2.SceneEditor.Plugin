<!--
  ギズモ軸空間「Global」アイコン (32x32)。経線・緯線を持つ地球儀。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="16" cy="16" r="12" />
    <ellipse cx="16" cy="16" rx="5.2" ry="12" />
    <path d="M 4 16 L 28 16" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="16" cy="16" r="12" />
    <ellipse cx="16" cy="16" rx="5.2" ry="12" />
    <path d="M 4 16 L 28 16" />
  </g>
</svg>
