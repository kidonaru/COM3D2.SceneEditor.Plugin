    <path d="M 13 28 L 13 20 L 19 20 L 19 28" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 16 4 L 29 15 L 26 15 L 26 28 L 6 28 L 6 15 L 3 15 Z" />
    <path d="M 13 28 L 13 20 L 19 20 L 19 28" />
  </g>
</svg>
