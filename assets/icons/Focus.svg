  白地に黒縁取りで、明るい背景上でも暗い背景上でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="none" stroke="#000000" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 4 11 L 4 4 L 11 4" />
    <path d="M 21 4 L 28 4 L 28 11" />
    <path d="M 28 21 L 28 28 L 21 28" />
    <path d="M 11 28 L 4 28 L 4 21" />
  </g>
  <circle cx="16" cy="16" r="4.3" fill="#000000" />
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 4 11 L 4 4 L 11 4" />
    <path d="M 21 4 L 28 4 L 28 11" />
    <path d="M 28 21 L 28 28 L 21 28" />
    <path d="M 11 28 L 4 28 L 4 21" />
  </g>
  <circle cx="16" cy="16" r="3.2" fill="#ffffff" />
</svg>
