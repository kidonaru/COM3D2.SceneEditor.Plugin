<!--
  「すべてのレイヤーを非表示」アイコン (32x32)。斜線で消した目。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
  斜線は瞳の上に重ねるため、最後にもう一度縁取り付きで描いている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="none" stroke="#000000" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 3 16 C 9 8, 23 8, 29 16 C 23 24, 9 24, 3 16 Z" />
  </g>
  <circle cx="16" cy="16" r="5.4" fill="#000000" />
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 3 16 C 9 8, 23 8, 29 16 C 23 24, 9 24, 3 16 Z" />
  </g>
  <circle cx="16" cy="16" r="3.8" fill="#ffffff" />
  <path d="M 6 27 L 26 5" fill="none" stroke="#000000" stroke-width="5.6" stroke-linecap="round" />
  <path d="M 6 27 L 26 5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
</svg>
