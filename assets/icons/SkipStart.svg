<!--
  タイムライン操作「先頭へ」アイコン (32x32)。左端の太い縦線と左向きの三角。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="3" y="6" width="5" height="20" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
  <polygon points="29,6 13,16 29,26" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
</svg>
