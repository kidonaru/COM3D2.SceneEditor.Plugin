<!--
  SceneView ツールバー「平行投影」アイコン (32x32)。立方体のワイヤーフレーム。
  白地に黒縁取りで、明るいシーン上でも暗いシーン上でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 等角投影の立方体。上面・左面・右面を白線で描く -->
  <g fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round">
    <path d="M 16 4 L 27 10 L 27 22 L 16 28 L 5 22 L 5 10 Z" />
    <path d="M 5 10 L 16 16 L 27 10 M 16 16 L 16 28" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 16 4 L 27 10 L 27 22 L 16 28 L 5 22 L 5 10 Z" />
    <path d="M 5 10 L 16 16 L 27 10 M 16 16 L 16 28" />
  </g>
</svg>
