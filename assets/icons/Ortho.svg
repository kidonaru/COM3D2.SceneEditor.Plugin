<!--
  SceneView ツールバー「平行投影」アイコン (32x32)。投影面へ向かう 3 本の平行な矢印。
  立方体はモデル表示 (Model) に譲り、投影方式そのものを表す形にしている。
  白地に黒縁取りで、明るいシーン上でも暗いシーン上でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="none" stroke="#000000" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 3 6 L 18 6 M 14.5 2.5 L 18 6 L 14.5 9.5" />
    <path d="M 3 16 L 18 16 M 14.5 12.5 L 18 16 L 14.5 19.5" />
    <path d="M 3 26 L 18 26 M 14.5 22.5 L 18 26 L 14.5 29.5" />
    <path d="M 27 3 L 27 29" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 3 6 L 18 6 M 14.5 2.5 L 18 6 L 14.5 9.5" />
    <path d="M 3 16 L 18 16 M 14.5 12.5 L 18 16 L 14.5 19.5" />
    <path d="M 3 26 L 18 26 M 14.5 22.5 L 18 26 L 14.5 29.5" />
    <path d="M 27 3 L 27 29" />
  </g>
</svg>
