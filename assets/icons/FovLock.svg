<!--
  タイムライン操作「視野角固定」アイコン (32x32)。左を頂点にした視野の扇形と右下の南京錠。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 視野の扇形 -->
  <g fill="none" stroke="#000000" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 22 5 L 4 15 L 20 24" />
    <path d="M 22 5 A 17 17 0 0 1 25 11" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 22 5 L 4 15 L 20 24" />
    <path d="M 22 5 A 17 17 0 0 1 25 11" />
  </g>
  <!-- 南京錠 -->
  <path d="M 21 21 L 21 18.5 A 4 4 0 0 1 29 18.5 L 29 21" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <rect x="18" y="20" width="14" height="11" rx="1.5" fill="#000000" />
  <path d="M 21 21 L 21 18.5 A 4 4 0 0 1 29 18.5 L 29 21" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <rect x="19.6" y="21.6" width="10.8" height="7.8" rx="1" fill="#ffffff" />
</svg>
