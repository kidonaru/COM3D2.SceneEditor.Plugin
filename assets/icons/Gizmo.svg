<!--
  SceneView ツールバー「ギズモ」アイコン (32x32)。3 軸の移動矢印。
  白地に黒縁取りで、明るいシーン上でも暗いシーン上でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g stroke="#000000" stroke-width="0.8" fill="#ffffff" stroke-linejoin="miter">
    <!-- 上方向 (Y 軸) -->
    <polygon points="16,3 20,9 17.4,9 17.4,17.2 14.6,17.2 14.6,9 12,9" />
    <!-- 左下方向 (X 軸) -->
    <polygon points="5.5,25.5 6.9,18.4 8.7,20.3 14.2,15.1 16.1,17.1 10.6,22.3 12.5,24.2" />
    <!-- 右下方向 (Z 軸) -->
    <polygon points="26.5,25.5 25.1,18.4 23.3,20.3 17.8,15.1 15.9,17.1 21.4,22.3 19.5,24.2" />
  </g>
</svg>
