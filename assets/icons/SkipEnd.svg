<!--
  タイムライン操作「最終へ」アイコン (32x32)。右向きの三角と右端の縦線。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <polygon points="4,6 20,16 4,26" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
  <rect x="25" y="6" width="3" height="20" fill="#ffffff" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" />
</svg>
