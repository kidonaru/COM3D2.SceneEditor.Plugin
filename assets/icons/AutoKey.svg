<!--
  タイムライン操作「自動登録」アイコン (32x32)。録画ボタンの輪の中にキーフレームのひし形。
  白地に黒縁取りで、明るい背景でも暗い背景でも視認できるようにしている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="12" fill="none" stroke="#000000" stroke-width="4.4" />
  <circle cx="16" cy="16" r="12" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <polygon points="16,9 23,16 16,23 9,16" fill="#ffffff" stroke="#000000" stroke-width="0.8" stroke-linejoin="round" />
</svg>
