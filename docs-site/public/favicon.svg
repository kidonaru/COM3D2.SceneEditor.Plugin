<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ギアメニューアイコン（暗背景 + アイソメ立方体）を基にした UnityEditor 風アイコン。
       手前のエッジにギズモの XYZ 軸色のアクセントを入れている -->
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#282828"/>
  <g stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round">
    <!-- 上面（最も明るい） -->
    <polygon points="32,12 51,23 32,34 13,23" fill="#e4e4e4"/>
    <!-- 左面（中間） -->
    <polygon points="13,23 32,34 32,55 13,44" fill="#a8a8a8"/>
    <!-- 右面（最も暗い） -->
    <polygon points="51,23 32,34 32,55 51,44" fill="#7d7d7d"/>
  </g>
  <!-- ギズモ軸色のエッジ: 縦=Y(緑) / 左下=X(赤) / 右下=Z(青) -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="32" y1="34" x2="32" y2="55" stroke="#5cc45c"/>
    <line x1="32" y1="55" x2="13" y2="44" stroke="#e5544f"/>
    <line x1="32" y1="55" x2="51" y2="44" stroke="#4d8be8"/>
  </g>
</svg>
